services:
  Qwen3.8-27B:
    container_name: Qwen3.8-27B-NVFP4
    image: ninfer-v3:local
    restart: always
    ports:
      - "58080:8000"
    command: [
      "ninfer-serve", "/data/MODELS/Qwen3.8-27B/qwen3_8_27b_nvfp4.ninfer",
      "--kv-dtype", "fp8",
      "--max-context", "131072",
      "--max-concurrency", "4",
      "--prefill-chunk", "2048",
      "--host-state-slots", "16",
      "--host-kv-mib", "0",
      "--spec", "mtp",
      "--draft-tokens", "4",
      "--lm-head-draft",
      "--preserve-thinking",
      "--host", "0.0.0.0",
      "--port", "8000",
      "--vision"
    ]
    volumes:
      - ./Qwen3.8-27B-nvfp4-NInfer-v3:/data/MODELS/Qwen3.8-27B
    environment:
      - TZ=Asia/Shanghai
    shm_size: 32g
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    extra_hosts:
      - "host.docker.internal:host-gateway"
